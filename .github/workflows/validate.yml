name: Validate extension

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run validate
      - run: npm test
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Test packaged extension in Chromium
        run: npm run test:e2e
      - name: Upload installable beta
        uses: actions/upload-artifact@v4
        with:
          name: claude-counter-blackspirits-0.5.0-beta.1
          path: dist/claude-counter-blackspirits/
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: test-results/
          if-no-files-found: ignore
