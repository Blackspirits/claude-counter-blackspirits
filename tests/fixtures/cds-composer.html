<!-- Structural reproduction of the CDS composer reported on 2026-10-23.
     No conversation content, account identifiers or generated element IDs. -->
<fieldset data-perf-region="composer" data-cds-dock-group>
 <div class="composer-stack" data-cds-dock-group>
  <div data-composer-card-holder>
   <div data-cds="ChatComposer">
    <div class="composer-card">
     <div data-cds="ChatComposerEditor"><div role="textbox" contenteditable="true" data-testid="chat-input" aria-label="Message">Reply</div></div>
     <div data-cds="ChatComposerActions"><button type="button" data-testid="chat-input-send">Send</button></div>
    </div>
    <div data-cds="ChatComposerChin">
     <div class="chin-row">
      <div class="chin-start"><button type="button" data-testid="chat-input-attach">Attach</button><button type="button">Microphone</button></div>
      <div class="chin-end">
       <div class="native-control-row">
        <div data-chorus-callout="model-selector"><span><div class="model-clip"><button type="button" data-cds="ModelSelector" data-testid="model-selector-dropdown">Opus · Medium</button></div></span></div>
        <span><span><button type="button" data-testid="mode-control">Manual</button></span></span>
       </div>
      </div>
     </div>
    </div>
   </div>
  </div>
 </div>
</fieldset>
